name: CI
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated version tag to publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test zm5-only/attack.test.cjs
      - name: Test local patch engine with generated data
        run: |
          clang -c zm5-only/PatchDecoder.c -o "$RUNNER_TEMP/decoder.o"
          swiftc -import-objc-header zm5-only/PatchDecoder.h zm5-only/PatchEngine.swift zm5-only/tests/main.swift "$RUNNER_TEMP/decoder.o" -llzma -lz -o "$RUNNER_TEMP/patch-test"
          "$RUNNER_TEMP/patch-test"
      - name: Build distributable without game resources
        run: |
          ZMXY_PACKAGE_WITHOUT_GAME=1 zsh zm5-only/build.sh "$RUNNER_TEMP/造梦西游攻击助手.app"
          test -z "$(find "$RUNNER_TEMP/造梦西游攻击助手.app" -iname '*.swf' -print)"
      - run: python3 -m py_compile tools/build_patch.py tools/build_patch4.py tools/build_patch3.py tools/build_patch3_features.py tools/build_patch3_commands.py tools/make_delta.py
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify immutable annotated version tag from main
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{}")"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' zm5-only/Info.plist)
          test "$RELEASE_TAG" = "v$version"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git merge-base --is-ancestor HEAD origin/main
      - name: Build and package
        run: |
          mkdir -p dist
          ZMXY_PACKAGE_WITHOUT_GAME=1 zsh zm5-only/build.sh "$RUNNER_TEMP/造梦西游攻击助手.app"
          test -z "$(find "$RUNNER_TEMP/造梦西游攻击助手.app" -iname '*.swf' -print)"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/造梦西游攻击助手.app" "dist/zaomeng-xiyou-$RELEASE_TAG-macos-arm64.zip"
          (cd dist && shasum -a 256 *.zip > SHA256SUMS)
      - name: Publish official Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## 下载与首次使用
          - 附件为可运行的 macOS Apple Silicon 助手，不是源码包；支持造梦3 v261029攻击、爆率/Boss掉落、经验、强化、炼丹与白名单物品/宠物潜能；造梦4 V58.8和造梦5 V47.8支持攻击倍率。
          - 仅 ad-hoc 签名，未做 Developer ID 签名或 Apple 公证。首次打开可能需要系统安全确认；Intel客户端在Apple Silicon上可能需要Rosetta。
          - 不含客户端、Flash或完整游戏SWF。用户须自行从官方来源下载安装依赖，不能把手游当成兼容客户端。
          - 官方客户端入口：https://webres.61.com/common/flash/common_micro.html?game=mole
          - 原始游戏文件请点击助手中的“官方游戏文件”，自行选择保存位置；助手从4399官方下载并校验。直接打开SWF链接可能被防盗链替换为提示文件。
          - 首次接入时先切换章节，再选择本地兼容客户端及对应原始SWF；助手仅在本机校验并生成补丁。已有兼容本地补丁可复用。
          - 接入前保存并完全退出游戏；接入将把所选客户端本地改名为“造梦西游”，并打开4399官方游戏入口。
          - SHA256SUMS用于校验下载完整性，不能代替签名。构建与本地补丁匹配已验证，其他用户机器与在线战斗不作已实测声明。
          NOTES
          if [[ "$RELEASE_TAG" == v5.2.0 ]]; then
            echo "注意：v5.2.0尚无游戏文件下载按钮，请优先使用v5.2.1；直接游戏链接可能被防盗链拦截。" >> "$RUNNER_TEMP/notes.md"
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --verify-tag --title "$RELEASE_TAG · 造梦西游攻击助手" --generate-notes --notes-file "$RUNNER_TEMP/notes.md"
